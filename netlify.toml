[build]
  publish = "dist"
  command = "npm test && npm run build"

[build.environment]
  NODE_VERSION = "22"

# Headers de sécurité et optimisations
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Assurer le bon type MIME pour les modules JavaScript
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# Les noms de fichiers restent stables : revalider après chaque déploiement.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Le jeu est statique, sans routes SPA. Les fichiers absents doivent renvoyer
# une vraie 404, jamais du HTML à la place d'un module JavaScript ou d'un PNG.
