<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle des sprites — Pixel Dojo</title><style>body{background:#17171c;color:#eee;font:14px Arial;padding:20px;max-width:1200px;margin:auto}h1{font-size:25px}nav{display:flex;gap:10px;margin:20px 0}button{padding:12px 25px;background:#292734;color:#fff;border:1px solid #766270;cursor:pointer}button.active{background:#9a2c44}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cell{background:repeating-conic-gradient(#282733 0% 25%,#33313d 0% 50%) 50% / 20px 20px;border:1px solid #655161}canvas{width:100%;aspect-ratio:1;image-rendering:pixelated}p{font-size:11px;padding:8px;margin:0;background:#121117}label{display:block;margin:20px 0}section{margin-top:15px}footer{color:#888;margin:20px 0}</style><h1>SPRITE REVIEW / 17 POSES PAR COMBATTANT</h1><div>Silhouette complète · Mains et pieds · Deux bras / deux jambes · Continuité de costume · Contours et transparence</div><nav id="nav"></nav><label>Fond : <select id="bg"><option value="grid">Damier</option><option value="#08090c">Noir</option><option value="#a0a0a0">Gris clair</option></select></label><section class="grid" id="grid"></section><footer>Les assets originaux sont conservés. Contrôle de découpe sans modification des pixels sources.</footer><script type="module">
import {SPRITES,LOW_SPRITES} from './sprite-data.mjs';
import {prepareFrames} from './sprite-renderer.mjs';
const prepared=[],preparedLow=[];
const lowImages=LOW_SPRITES.map((data,i)=>{const im=new Image();im.src=data.file;im.onload=()=>{preparedLow[i]=prepareFrames(im,data);draw();};return im;});
const names=['Jin','Kazuya','Jun','Reina'],poses=['Garde','Respiration','Marche A','Marche B','Jab : anticipation','Jab : extension','Jab : récupération','Side kick','Launcher : anticipation','Launcher : impact','Garde basse','Garde haute','Impact reçu','Au sol','Victoire','Frappe puissante','Balayage bas'];let current=0;
const images=SPRITES.map((data,i)=>{const im=new Image();im.src=data.file;im.onload=()=>{prepared[i]=prepareFrames(im,data);draw();};return im;});
const grid=document.getElementById('grid');poses.forEach((p,i)=>{const el=document.createElement('div');el.className='cell';el.innerHTML='<canvas width="320" height="320"></canvas><p>'+String(i).padStart(2,'0')+' · '+p+'</p>';grid.append(el);});
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{current=i;draw();};document.getElementById('nav').append(b);});
function draw(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===current));const im=images[current];if(!im.complete||!im.naturalWidth)return;document.querySelectorAll('canvas').forEach((el,i)=>{const c=el.getContext('2d');c.clearRect(0,0,320,320);c.imageSmoothingEnabled=false;const data=i===16?LOW_SPRITES[current]:SPRITES[current],f=data.frames[i===16?0:i],scale=Math.min(300/data.basis,300/f.w),frame=i===16?preparedLow[current]?.[0]:prepared[current]?.[i];if(!frame)return;c.drawImage(frame,0,0,f.w,f.h,Math.round((320-f.w*scale)/2),Math.round(303-f.h*scale),Math.round(f.w*scale),Math.round(f.h*scale));});}
document.getElementById('bg').onchange=e=>{document.querySelectorAll('.cell').forEach(el=>el.style.background=e.target.value==='grid'?'':e.target.value);};
</script></html>
